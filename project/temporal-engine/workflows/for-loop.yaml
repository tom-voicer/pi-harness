# For loop — iterate over array, classify each item with `if`
document:
  dsl: 1.0.0
  taskQueue: zigflow
  workflowType: for-loop-demo
  version: 1.0.0
  title: For Loop Demo
  summary: Iterate over items, classify each with if

do:
  - setup:
      set:
        users:
          - { name: Alice, role: admin }
          - { name: Bob, role: editor }
          - { name: Carol, role: viewer }

  # For loop over users — each iteration runs as a child workflow.
  # Only the first matching `if` executes per iteration.
  - processUsers:
      export:
        as: "${ $context + { classifiedResults: . } }"
      for:
        each: user
        in: "${ $data.users }"
        at: idx
      do:
        - handleAdmin:
            if: "${ $data.user.role == \"admin\" }"
            set:
              name: "${ $data.user.name }"
              access: full
              index: "${ $data.idx }"

        - handleEditor:
            if: "${ $data.user.role == \"editor\" }"
            set:
              name: "${ $data.user.name }"
              access: write
              index: "${ $data.idx }"

        - handleViewer:
            if: "${ $data.user.role == \"viewer\" }"
            set:
              name: "${ $data.user.name }"
              access: read
              index: "${ $data.idx }"

  # Integer repeat loop
  - countdown:
      export:
        as: "${ $context + { countdownNumbers: . } }"
      for:
        in: "${ 3 }"
      do:
        - tick:
            set:
              value: "${ 3 - $data.item }"

  - done:
      set:
        userCount: "${ $data.users | length }"
        classified: "${ $context.classifiedResults }"
        countdown: "${ $context.countdownNumbers }"
