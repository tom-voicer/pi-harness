# Full demo: if/else + for loop + parallel + wait
document:
  dsl: 1.0.0
  taskQueue: zigflow
  workflowType: full-demo
  version: 1.0.0
  title: Full Demo — All Control Flow Constructs
  summary: if/else via task `if` property, for loops, fork (parallel), and wait

do:
  # ── Step 1: Set up initial data ──
  - init:
      set:
        batch:
          - { id: 1, priority: "high" }
          - { id: 2, priority: "low" }
          - { id: 3, priority: "high" }
          - { id: 4, priority: "medium" }
          - { id: 5, priority: "low" }

  # ── Step 2: For loop — classify each item using `if` ──
  - classifyBatch:
      export:
        as: "${ $context + { classified: . } }"
      for:
        each: item
        in: "${ $data.batch }"
        at: index
      do:
        - markUrgent:
            if: "${ $data.item.priority == \"high\" }"
            set:
              id: "${ $data.item.id }"
              label: URGENT

        - markNormal:
            if: "${ $data.item.priority == \"medium\" }"
            set:
              id: "${ $data.item.id }"
              label: NORMAL

        - markLow:
            if: "${ $data.item.priority == \"low\" }"
            set:
              id: "${ $data.item.id }"
              label: LOW

  # ── Step 3: Wait ──
  - pause:
      wait:
        seconds: 1

  # ── Step 4: If/else — stop early if too many urgent items ──
  - checkUrgent:
      if: "${ ($context.classified | map(select(.label == \"URGENT\")) | length) > 10 }"
      set:
        alert: "Many urgent items detected — stopping early"
      then: end

  # ── Step 5: Fork — two parallel HTTP fetches ──
  - fetchExternal:
      export:
        as: "${ $context + { external: . } }"
      fork:
        compete: false
        branches:
          - getPost:
              call: http
              with:
                method: get
                endpoint: https://jsonplaceholder.typicode.com/posts/1

          - getUser:
              call: http
              with:
                method: get
                endpoint: https://jsonplaceholder.typicode.com/users/1

  # ── Step 6: Final summary ──
  - summarize:
      output:
        as:
          summary:
            totalItems: "${ $data.batch | length }"
            urgentCount: "${ $context.classified | map(select(.label == \"URGENT\")) | length }"
            normalCount: "${ $context.classified | map(select(.label == \"NORMAL\")) | length }"
            lowCount: "${ $context.classified | map(select(.label == \"LOW\")) | length }"
            externalPost: "${ $context.external.getPost.title }"
            externalUser: "${ $context.external.getUser.name }"
      set:
        complete: true
