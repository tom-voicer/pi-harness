# Simple count-based for loop (repeat N times)
document:
  dsl: 1.0.0
  taskQueue: zigflow
  workflowType: repeat-demo
  version: 1.0.0
  title: Repeat N Times
  summary: Uses a numeric for-in to repeat a block

do:
  - repeatFiveTimes:
      output:
        as:
          messages: "${ $context.messages }"
      for:
        in: "${ 5 }"
      do:
        - sayHello:
            export:
              as: "${ $context + { messages: ($context.messages // []) + [\"Iteration \" + ($data.item | tostring)] } }"
            set:
              iteration: "${ $data.item }"

  - done:
      set:
        count: "${ $data.messages | length }"
