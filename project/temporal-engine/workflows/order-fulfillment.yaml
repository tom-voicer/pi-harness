# Order Fulfillment Pipeline — complex workflow exercising all constructs
# Constructs used: set, for, switch, if, fork, wait, try, call:http, export.as, output.as
document:
  dsl: 1.0.0
  taskQueue: zigflow
  workflowType: order-fulfillment
  version: 1.0.0
  title: Order Fulfillment Pipeline
  summary: >
    Full order lifecycle: validate, process line items with tier discounts
    (switch), check approval threshold (if), fulfill via parallel payment +
    inventory + confirmation (fork), handle validation errors (try).

do:
  # ═══════════════════════════════════════════════════════════
  # Step 1: Initialize order data
  # ═══════════════════════════════════════════════════════════
  - init:
      set:
        customer:
          name: "Acme Corp"
          tier: premium           # premium | standard | basic
          email: "orders@acme.example.com"
        lineItems:
          - { sku: "WIDGET-A", name: "Widget Alpha", qty: 5, unitPrice: 49.99 }
          - { sku: "WIDGET-B", name: "Widget Beta", qty: 2, unitPrice: 149.99 }
          - { sku: "GADGET-X", name: "Gadget X Pro", qty: 1, unitPrice: 399.99 }
        shipping:
          method: express
          zip: "94105"

  # ═══════════════════════════════════════════════════════════
  # Step 2: Validate order structure (if + raise — try/catch avoided due to zigflow 0.11.3 child-wf registration issue)
  # ═══════════════════════════════════════════════════════════
  - validateOrder:
      do:
        - checkEmpty:
            if: "${ ($data.lineItems | length) == 0 }"
            raise:
              error:
                type: https://serverlessworkflow.io/spec/1.0.0/errors/validation
                status: 400
                title: Empty order
                detail: "Order must contain at least one line item"
        - checkCustomer:
            if: "${ $data.customer.name == \"\" }"
            raise:
              error:
                type: https://serverlessworkflow.io/spec/1.0.0/errors/validation
                status: 400
                title: Missing customer
                detail: "Customer name is required"

  # ═══════════════════════════════════════════════════════════
  # Step 3: Process each line item with tier discounts
  # ═══════════════════════════════════════════════════════════
  - processItems:
      export:
        as: "${ $context + { processedItems: . } }"
      for:
        each: item
        in: "${ $data.lineItems }"
        at: idx
      do:
        # Step 3a: Check "inventory" (simulated)
        - checkStock:
            set:
              inStock: true
              warehouseId: "${ \"WH-\" + ($data.idx + 1 | tostring) }"

        # Step 3b: Apply discount by customer tier (if — switch avoided inside for-loop due to child-wf registration)
        - setPremiumDiscount:
            if: "${ $data.customer.tier == \"premium\" }"
            set:
              discountPct: 20
              discountLabel: "Premium (20%)"

        - setStandardDiscount:
            if: "${ $data.customer.tier == \"standard\" }"
            set:
              discountPct: 10
              discountLabel: "Standard (10%)"

        - setBasicDiscount:
            if: "${ $data.customer.tier == \"basic\" }"
            set:
              discountPct: 0
              discountLabel: "Basic (0%)"

        # Step 3c: Calculate item totals
        - calculateTotals:
            set:
              sku: "${ $data.item.sku }"
              name: "${ $data.item.name }"
              qty: "${ $data.item.qty }"
              unitPrice: "${ $data.item.unitPrice }"
              lineSubtotal: "${ $data.item.qty * $data.item.unitPrice }"
              discountAmount: "${ ($data.item.qty * $data.item.unitPrice * $data.discountPct / 100) | floor }"
              lineTotal: "${ ($data.item.qty * $data.item.unitPrice * (100 - $data.discountPct) / 100) | floor }"
              discountPct: "${ $data.discountPct }"
              discountLabel: "${ $data.discountLabel }"
              inStock: "${ $data.inStock }"
              warehouseId: "${ $data.warehouseId }"

  # ═══════════════════════════════════════════════════════════
  # Step 4: Calculate order-level totals
  # ═══════════════════════════════════════════════════════════
  - calculateOrderTotals:
      set:
        subtotal: "${ $context.processedItems | map(.lineTotal) | add }"
        totalSavings: "${ $context.processedItems | map(.discountAmount) | add }"
        itemCount: "${ $context.processedItems | length }"

  # ═══════════════════════════════════════════════════════════
  # Step 5: If/else — check approval threshold (> 500 needs approval)
  # ═══════════════════════════════════════════════════════════
  - waitForApproval:
      if: "${ $data.subtotal > 500 }"
      wait:
        seconds: 2

  - flagForApproval:
      if: "${ $data.subtotal > 500 }"
      set:
        approvalRequired: true
        approvalStatus: auto-approved
        approvalNote: "Auto-approved for POC demo"

  - skipApproval:
      if: "${ $data.subtotal <= 500 }"
      set:
        approvalRequired: false
        approvalStatus: not-required
        approvalNote: "Below threshold"

  # ═══════════════════════════════════════════════════════════
  # Step 6: Parallel fulfillment (fork)
  # ═══════════════════════════════════════════════════════════
  - fulfillOrder:
      export:
        as: "${ $context + { fulfillment: . } }"
      fork:
        compete: false
        branches:
          # Branch A: Charge payment
          - chargePayment:
              call: http
              with:
                method: get
                endpoint: https://jsonplaceholder.typicode.com/posts/2
              output:
                as:
                  transactionId: "${ \"TXN-\" + uuid }"
                  amount: "${ $data.subtotal }"
                  status: success

          # Branch B: Reserve inventory
          - reserveInventory:
              do:
                - pause:
                    wait:
                      seconds: 1
                - confirm:
                    set:
                      reservationId: "${ \"RES-\" + uuid }"
                      itemsReserved: "${ $data.itemCount }"
                      status: reserved

          # Branch C: Send confirmation
          - sendConfirmation:
              do:
                - generateMessage:
                    set:
                      recipient: "${ $data.customer.email }"
                      subject: "Order Confirmation"
                      body: "${ \"Thank you for your order, \" + $data.customer.name + \"!\" }"
                - wait:
                    wait:
                      seconds: 1
                - markSent:
                    set:
                      emailSent: true
                      sentAt: "${ timestamp_iso8601 }"

  # ═══════════════════════════════════════════════════════════
  # Step 7: Final report
  # ═══════════════════════════════════════════════════════════
  - generateReport:
      output:
        as:
          report:
            customer: "${ $data.customer.name }"
            tier: "${ $data.customer.tier }"
            shipping: "${ $data.shipping.method }"
            items:
              processed: "${ $context.processedItems }"
            orderTotals:
              subtotal: "${ $data.subtotal }"
              savings: "${ $data.totalSavings }"
              itemCount: "${ $data.itemCount }"
            approval:
              required: "${ $data.approvalRequired }"
              status: "${ $data.approvalStatus }"
            fulfillment:
              payment: "${ $context.fulfillment.chargePayment }"
              inventory: "${ $context.fulfillment.reserveInventory }"
              confirmation: "${ $context.fulfillment.sendConfirmation }"
      set:
        complete: true
        completedAt: "${ timestamp_iso8601 }"
